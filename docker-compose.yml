services:
  edmissions:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      EDMISSIONS_DATA_DIR: /app/data
      EDMISSIONS_MUSIC_DIR: /app/data/music
      EDMISSIONS_TRUST_PROXY: "1"
    volumes:
      # SQLite database and the local music library survive redeploys
      - ./data:/app/data
    networks:
      # joins the existing chiefofstaff nginx network so that proxy can reach
      # this container by service name (edmissions:3000) — no host port needed
      - chiefofstaff_default

networks:
  chiefofstaff_default:
    external: true
