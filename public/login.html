<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDMissions — log in</title>
  <meta name="theme-color" content="#10051f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="login-body">
  <video id="login-video" class="login-video" muted loop playsinline aria-hidden="true">
    <source data-src="/media/people-at-a-rave-coverr.mp4" type="video/mp4">
  </video>
  <form id="login-form" class="login-card">
    <h1 class="logo" aria-label="EDMissions"><span class="logo-edm">EDM</span><span class="logo-issions">issions</span></h1>
    <p class="muted">the rave console for higher ed</p>
    <label class="field"><span>Username</span><input name="username" autocomplete="username" required></label>
    <label class="field"><span>Password</span><input name="password" type="password" autocomplete="current-password" required></label>
    <button class="btn btn-neon" type="submit">Enter the console</button>
    <p id="login-error" class="error" role="alert" hidden></p>
    <p class="login-credit">Video: <a href="https://coverr.co/videos/people-at-a-rave-ygh2rjzltq" target="_blank" rel="noopener noreferrer">People at a rave</a> via Coverr</p>
  </form>
  <script>
    const themeColor = document.querySelector('meta[name="theme-color"]');
    const backgroundColor = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    if (themeColor && backgroundColor) themeColor.content = backgroundColor;

    const video = document.getElementById('login-video');
    if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
      const source = video.querySelector('source');
      source.src = source.dataset.src;
      video.load();
      video.play().catch(() => {});
    }
    const form = document.getElementById('login-form');
    const err = document.getElementById('login-error');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      err.hidden = true;
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: form.username.value.trim(), password: form.password.value }),
      }).catch(() => null);
      if (res && res.ok) { location.href = '/'; return; }
      const data = res ? await res.json().catch(() => ({})) : {};
      err.textContent = data.error || 'Login failed — is the server running?';
      err.hidden = false;
    });
  </script>
</body>
</html>
