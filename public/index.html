<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDMissions</title>
  <meta name="theme-color" content="#10051f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <canvas id="viz" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand-lockup">
      <h1 class="logo" aria-label="EDMissions"><span class="logo-edm">EDM</span><span class="logo-issions">issions</span></h1>
      <span class="brand-note">enrollment, amplified</span>
    </div>
    <nav class="modes" id="mode-bar" aria-label="Intensity mode">
      <button data-mode="intense">Intense Focus</button>
      <button data-mode="vibing">Vibing</button>
      <button data-mode="chill">Chill</button>
      <button data-mode="off" class="active">Off</button>
    </nav>
    <div class="account">
      <span id="welcome" class="welcome" hidden></span>
      <button id="logout" class="btn btn-ghost">log out</button>
    </div>
  </header>

  <main class="grid">
    <section class="panel" id="panel-player" aria-label="Player">
      <header class="panel-title"><h2>Player</h2><span>Set the room</span></header>
      <div id="player-root"><p class="muted">Pick a mode to start the music.</p></div>
    </section>
    <section class="panel" id="panel-notes" aria-label="Research hub">
      <header class="panel-title"><h2>Research Hub</h2><span>Ask, capture, connect</span></header>
      <div id="notes-root"></div>
    </section>
    <section class="panel" id="panel-feed" aria-label="Higher-ed feed">
      <header class="panel-title"><h2>Higher-Ed Feed</h2><span>Recent signals first</span></header>
      <div id="feed-root"></div>
    </section>
    <section class="panel" id="panel-campaigns" aria-label="Campaigns">
      <header class="panel-title"><h2>Campaign Studio</h2><span>From brief to send-ready</span></header>
      <div id="campaigns-root"></div>
    </section>
    <section class="panel" id="panel-tasks" aria-label="Tasks">
      <header class="panel-title"><h2>Tasks</h2><span>Keep the set moving</span></header>
      <div id="tasks-root"></div>
    </section>
  </main>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
