<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDMissions</title>
  <meta name="theme-color" content="#10051f">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>
  <canvas id="viz" aria-hidden="true"></canvas>

  <header class="topbar">
    <div class="brand-lockup">
      <h1 class="logo" aria-label="EDMissions"><span class="logo-edm">EDM</span><span class="logo-issions">issions</span></h1>
      <span class="brand-note">enrollment, amplified</span>
    </div>
    <nav class="modes" id="mode-bar" aria-label="Intensity mode">
      <button data-mode="intense" aria-pressed="false">Intense Focus</button>
      <button data-mode="vibing" aria-pressed="false">Vibing</button>
      <button data-mode="chill" aria-pressed="false">Chill</button>
      <button data-mode="off" class="active" aria-pressed="true">Off</button>
    </nav>
    <div class="account">
      <span id="welcome" class="welcome" hidden></span>
      <button id="logout" class="btn btn-ghost">log out</button>
    </div>
  </header>

  <section class="player-bar" id="panel-player" aria-label="Player">
    <header class="player-heading">
      <h2>Player</h2>
      <span>Set the room</span>
    </header>
    <div id="player-root"><p class="muted">Pick a mode to start the music.</p></div>
  </section>

  <main class="grid">
    <section class="work-hub" aria-label="Main workspace">
      <div class="workspace-tabs" role="tablist" aria-label="Main workspace">
        <button class="workspace-tab active" id="tab-research" role="tab" aria-selected="true" aria-controls="panel-notes">
          <span>Research Hub</span>
          <small>Ask, capture, connect</small>
        </button>
        <button class="workspace-tab" id="tab-campaigns" role="tab" aria-selected="false" aria-controls="panel-campaigns" tabindex="-1">
          <span>Campaign Studio</span>
          <small>From brief to send-ready</small>
        </button>
      </div>
      <section class="workspace-pane" id="panel-notes" role="tabpanel" aria-labelledby="tab-research" tabindex="0">
        <div id="notes-root"></div>
      </section>
      <section class="workspace-pane" id="panel-campaigns" role="tabpanel" aria-labelledby="tab-campaigns" tabindex="0" hidden>
        <div id="campaigns-root"></div>
      </section>
    </section>
    <aside class="side-rail" aria-label="Dashboard side panels">
      <section class="panel" id="panel-feed" aria-label="Higher-ed feed">
        <header class="panel-title"><h2>Higher-Ed Feed</h2><span>Recent signals first</span></header>
        <div id="feed-root"></div>
      </section>
      <section class="panel" id="panel-tasks" aria-label="Tasks">
        <header class="panel-title"><h2>Tasks</h2><span>Keep the set moving</span></header>
        <div id="tasks-root"></div>
      </section>
    </aside>
  </main>

  <section class="secondary-tools" aria-label="Planning tools">
    <section class="panel secondary-panel" id="panel-moments" aria-label="Enrollment Moments">
      <header class="panel-title"><h2>Enrollment Moments</h2><span>Verified dates into action</span></header>
      <div id="moments-root"></div>
    </section>
    <section class="panel secondary-panel" id="panel-brief" aria-label="AVP Brief">
      <header class="panel-title"><h2>AVP Brief</h2><span>Build on demand</span></header>
      <div id="brief-root"></div>
    </section>
  </section>

  <dialog id="use-this-dialog" class="workbench-dialog">
    <div id="workbench-root"></div>
  </dialog>

  <div id="app-status" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
